<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estación de reconstrucción mecánica</title></head><body>
<header><div class="brand"><span class="mark">⌬</span><span>Estación mecánica</span></div><div class="mast">RECONSTRUCCIÓN CAD</div><span id="status" role="status">Iniciando núcleo…</span></header>
<div class="layout"><aside class="tree"><label class="eyebrow" for="assembly">Ensamble</label><select id="assembly"><option value="C">C · Embrague hidráulico</option><option value="B">B · Embrague de automóvil</option><option value="A">A · Transmisión</option></select><div class="section-head"><h2>Componentes</h2><span id="count"></span></div><div id="tree"></div></aside>
<main><div class="model-title"><div><div class="eyebrow" id="sheet"></div><h1 id="title"></h1></div><button id="fit">Encuadrar</button></div>
<div class="toolbar"><label>Vista <select id="view"><option>Isométrica</option><option>Perspectiva</option><option>Axial</option><option>Frontal</option><option>Posterior</option><option>Superior</option><option>Inferior</option><option>Izquierda</option></select></label><label>Sección <select id="section"><option value="none">Completa</option><option value="long">Longitudinal</option><option value="cross">Transversal</option></select></label><label><input type="checkbox" id="transparent">Carcasa translúcida</label><label><input type="checkbox" id="wire">Malla</label></div>
<div id="stage"><div id="overlay"></div><span class="axis-tag">mm · eje longitudinal Z</span></div>
<div class="motion"><div class="section-head"><h2>Movimiento</h2><span id="state"></span></div><div class="transport"><button id="play">Reproducir</button><button id="reset">Reiniciar</button><input id="timeline" aria-label="Tiempo" type="range" min="0" max="60" step=".01" value="0"><output id="time">0.0 s</output></div><div class="sliders"><label id="eng-row">Acoplamiento <input id="eng" type="range" min="0" max="1" step=".005" value="0"></label><label>Explosión <input id="explode" type="range" min="0" max="2" step=".01" value="0"></label><label>Plano de corte <input id="cut" type="range" min="-1" max="1" step=".005" value="0"></label></div>
<details><summary>Velocidades y sentido</summary><div class="sliders"><label>Entrada (rpm)<input id="rpm" type="number" value="24" min="-300" max="300"></label><label>Salida libre (rpm)<input id="free" type="number" value="0" min="-300" max="300"></label><label>Velocidad temporal<input id="speed" type="number" value="1" min=".1" max="5" step=".1"></label><button id="reverse">Invertir giro</button></div></details></div></main>
<aside class="props"><div class="eyebrow">Inspector</div><h2 id="part-name">Seleccione una pieza</h2><div id="properties"></div><div class="actions"><button id="isolate">Aislar</button><button id="hide">Ocultar</button><button id="show">Mostrar todo</button></div>
<details open><summary>Parámetros del ensamble</summary><form id="params"></form><button id="apply">Regenerar sólidos</button><p id="error" role="alert"></p></details>
<details open><summary>Estado mecánico</summary><div id="metrics"></div></details>
<details><summary>Comparación con la lámina</summary><label>Referencia <select id="refView"><option value="off">Oculta</option><option value="source">Lámina completa</option><option value="aligned">Sección axial alineada</option></select></label><label>Opacidad <input id="opacity" type="range" min="0" max="1" step=".01" value=".45"></label><p id="calibration"></p></details>
<details><summary>Exportar</summary><div class="actions"><button id="step">STEP ensamble</button><button id="partstep">STEP pieza</button><button id="glb">GLB animado</button><button id="json">JSON</button><button id="png">PNG</button></div><a id="drawings" target="_blank">Planos y validación de fábrica ↗</a></details></aside></div>
<script type="module" src="/src/main.ts"></script></body></html>
