name: M3 branch integration and acceptance
on:
  push:
    branches: [feature/m3-pdf-cad]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    if: github.ref == 'refs/heads/feature/m3-pdf-cad'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Import reviewed M3 source bundle once on feature branch
        if: hashFiles('docs/m3/revision-2.txt') == ''
        env:
          M3_SOURCE_ARCHIVE: 
        run: |
          python - <<'PY'
          import os,base64,zipfile,io,hashlib,pathlib
          data=base64.b64decode(os.environ['M3_SOURCE_ARCHIVE'])
          assert hashlib.sha256(data).hexdigest() == '6d9b4d2e67e3fc74f8961049030eee28f03311da93127d7293d4df36ff70832e'
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              for n in z.namelist():
                  p=pathlib.PurePosixPath(n)
                  assert not p.is_absolute() and '..' not in p.parts and not n.startswith('.git/')
              z.extractall('.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src scripts tests public/mappings public/document-manifest.json docs/m3
          git commit -m "feat(M3): native PDF workspace, linked evidence and synchronized CAD selection"
          git push origin HEAD:feature/m3-pdf-cad
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate:mappings
      - run: npm run pdf:export
      - run: npm run build -- --base=/CAD/
      - name: Build GitHub Pages base path
        run: npx vite build --base=/CAD/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright pymupdf
      - run: python -m playwright install --with-deps chromium
      - name: Browser acceptance against compiled app
        run: python scripts/m3-browser.py
      - name: Independent PDF validation
        run: |
          python - <<'PY'
          import fitz, json
          for s in ['280','281']:
              a=fitz.open(f'public/laminas/{s}.pdf'); b=fitz.open(f'public/linked-pdfs/{s}-interactive.pdf')
              assert a[0].get_pixmap().samples == b[0].get_pixmap().samples
              assert b[0].get_links()
              print(s, len(b[0].get_links()), 'links / original artwork preserved')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M3-review-evidence
          path: |
            docs/m3
            public/linked-pdfs
            dist
